<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الماهر في الفيزياء | Eng. Ahmed Maher</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='6' fill='%234fd8ff'/%3E%3Cellipse cx='50' cy='50' rx='42' ry='16' fill='none' stroke='%23f2b134' stroke-width='4'/%3E%3Cellipse cx='50' cy='50' rx='42' ry='16' fill='none' stroke='%234fd8ff' stroke-width='4' transform='rotate(60 50 50)'/%3E%3Cellipse cx='50' cy='50' rx='42' ry='16' fill='none' stroke='%238b7bff' stroke-width='4' transform='rotate(120 50 50)'/%3E%3C/svg%3E">

<!-- Prevent a flash of the wrong theme on load (pure UI preference, no data access) -->
<script>
  try{
    var t = localStorage.getItem('almaher-theme');
    if(t === 'light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authScreen">
  <div class="card">
    <div class="auth-badge">⚛</div>
    <h2>تسجيل الدخول</h2>
    <p class="auth-sub">الماهر في الفيزياء — Eng. Ahmed Maher</p>
    <div class="field" style="text-align:right;"><label>البريد الإلكتروني</label><input type="email" id="authEmail"></div>
    <div class="field" style="text-align:right;"><label>كلمة المرور</label><input type="password" id="authPass"></div>
    <p id="authError"></p>
    <div style="text-align:center; margin-bottom:10px;"><button class="btn outline small" id="forgotBtn" type="button">🔑 نسيت كلمة المرور؟</button></div>
    <div class="modal-actions" style="justify-content:center;">
      <button class="btn outline" id="signupBtn">إنشاء حساب جديد</button>
      <button class="btn gold" id="loginBtn">دخول</button>
    </div>
    <p class="auth-foot">أول مرة تفتح البرنامج؟ اكتب إيميل وباسورد واضغط "إنشاء حساب جديد" — بعد كده استخدم نفس البيانات من أي جهاز.</p>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <header class="top">
    <div class="title">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="badge">⚛</div>
      <div>
        <h1><span class="cmt">⚡</span> الماهر في الفيزياء</h1>
        <p class="sub">Eng. Ahmed Maher</p>
      </div>
    </div>
    <div class="head-actions">
      <span id="syncBadge" class="pill paid" style="display:none;"></span>
      <button id="themeToggleBtn" title="تبديل المظهر">☀️</button>
      <button class="btn outline" id="settingsBtn">⚙ إعدادات</button>
    </div>
  </header>
  <div class="term-bar">⚛ <b>متابعة الطلاب</b> · الحضور · المجموعات · المدفوعات</div>

  <nav class="tabs" id="tabs">
    <button data-tab="groups" class="active">🗂 المجموعات</button>
    <button data-tab="months">📅 الشهور</button>
    <button data-tab="income">💰 الدخل الشهري</button>
    <button data-tab="arrears">⏰ المتأخرات</button>
    <button data-tab="dropouts">🚫 المنقطعين</button>
    <button data-tab="notify">📲 إخطار أولياء الأمور</button>
    <button data-tab="reports">📊 التقارير والإحصائيات</button>
  </nav>

  <div id="groupsView">
    <div class="dashboard-stats" id="dashboardStats"></div>
    <div id="sessionLauncher" style="margin-bottom:16px;"></div>
    <div class="section-title"><span>مجموعاتك</span><div class="line"></div></div>
    <div class="group-grid" id="groupGrid"></div>
  </div>

  <div id="groupView" style="display:none;"></div>

  <div id="monthsView" style="display:none;"></div>

  <div id="incomeView" style="display:none;"></div>

  <div id="arrearsView" style="display:none;"></div>

  <div id="dropoutsView" style="display:none;"></div>

  <div id="notifyView" style="display:none;"></div>

  <div id="reportsView" style="display:none;"></div>

  <div id="profileView" style="display:none;"></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
